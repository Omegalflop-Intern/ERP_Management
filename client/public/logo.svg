<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="#0F172A" />
  
  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#omniGrad)" stroke-width="24" stroke-dasharray="800" stroke-dashoffset="100" stroke-linecap="round" filter="url(#glow)" opacity="0.9" />
  
  <!-- Futuristic Geometric 'O' & 'M' Core Emblem -->
  <path d="M160 352 V 176 L 256 272 L 352 176 V 352" fill="none" stroke="url(#omniGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Orbiting Cyan Accent Node -->
  <circle cx="360" cy="160" r="24" fill="url(#accentGrad)" filter="url(#glow)" />
</svg>
