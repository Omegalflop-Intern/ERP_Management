<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="20" y1="10" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="32" y1="24" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow -->
  <rect x="28" y="14" width="72" height="100" rx="16" fill="url(#phoneGrad)" opacity="0.15"/>

  <!-- Phone Body Bezel -->
  <rect x="30" y="16" width="68" height="96" rx="14" fill="url(#phoneGrad)"/>

  <!-- Inner Screen -->
  <rect x="34" y="22" width="60" height="84" rx="10" fill="url(#screenGrad)"/>

  <!-- Dynamic Island Notch -->
  <rect x="52" y="26" width="24" height="6" rx="3" fill="#111827"/>

  <!-- Graph / ERP Lines on Screen -->
  <path d="M42 80 L54 66 L66 74 L84 52" stroke="#EF4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="84" cy="52" r="4" fill="#EF4444"/>

  <!-- ERP Shield Badge (Bottom Right) -->
  <circle cx="86" cy="86" r="18" fill="url(#badgeGrad)"/>
  <path d="M78 86 L84 92 L95 80" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
