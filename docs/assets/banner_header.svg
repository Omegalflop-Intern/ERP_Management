<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="40%" stop-color="#7f1d1d" />
      <stop offset="80%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="glowRed" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Pattern Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glossy Overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGradient)" />
  <rect width="1000" height="260" rx="16" fill="url(#grid)" />
  
  <!-- Glowing Orbs -->
  <circle cx="200" cy="80" r="180" fill="url(#glowRed)" />
  <circle cx="800" cy="180" r="160" fill="url(#glowCyan)" />

  <!-- Top Glass Flare -->
  <rect width="1000" height="130" rx="16" fill="url(#gloss)" />

  <!-- Outer Border Frame -->
  <rect width="998" height="258" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

  <!-- Phone / Hardware Graphic Icon -->
  <g transform="translate(60, 45)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="110" height="170" rx="18" fill="#1e293b" stroke="#fecaca" stroke-width="3" />
    <rect x="8" y="12" width="94" height="146" rx="10" fill="#0f172a" />
    <!-- Screen Accent Elements -->
    <rect x="18" y="24" width="74" height="12" rx="4" fill="#dc2626" opacity="0.9" />
    <rect x="18" y="44" width="44" height="8" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="18" y="58" width="74" height="6" rx="3" fill="#64748b" opacity="0.6" />
    <rect x="18" y="70" width="60" height="6" rx="3" fill="#64748b" opacity="0.4" />
    <!-- Barcode / IMEI Sim Graphic -->
    <g transform="translate(18, 90)">
      <rect x="0" y="0" width="74" height="30" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="10" y1="6" x2="10" y2="24" stroke="#fef08a" stroke-width="2"/>
      <line x1="16" y1="6" x2="16" y2="24" stroke="#fef08a" stroke-width="1"/>
      <line x1="22" y1="6" x2="22" y2="24" stroke="#fef08a" stroke-width="3"/>
      <line x1="30" y1="6" x2="30" y2="24" stroke="#fef08a" stroke-width="1"/>
      <line x1="36" y1="6" x2="36" y2="24" stroke="#fef08a" stroke-width="2"/>
      <line x1="44" y1="6" x2="44" y2="24" stroke="#fef08a" stroke-width="3"/>
      <line x1="52" y1="6" x2="52" y2="24" stroke="#fef08a" stroke-width="1"/>
      <line x1="60" y1="6" x2="60" y2="24" stroke="#fef08a" stroke-width="2"/>
    </g>
    <!-- Home Pill Button -->
    <rect x="42" y="130" width="26" height="4" rx="2" fill="#94a3b8" />
  </g>

  <!-- Typography Content -->
  <g transform="translate(200, 50)">
    <!-- Pill Tag Header -->
    <g transform="translate(0, 0)">
      <rect width="260" height="26" rx="13" fill="rgba(254, 240, 138, 0.15)" stroke="rgba(254, 240, 138, 0.4)" stroke-width="1" />
      <text x="130" y="17" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">NEXT-GEN RETAIL &amp; SERVICE ERP</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">Brothers Mobile Shop ERP</text>

    <!-- Subtitle -->
    <text x="0" y="96" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Complete Enterprise Resource Planning • POS • IMEI Serial Tracker • Repairs • HR &amp; Double-Entry Accounting</text>

    <!-- Feature Pills Bar -->
    <g transform="translate(0, 120)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="28" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#ef4444" />
      <text x="26" y="18" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="600">15-Digit IMEI Tracker</text>

      <!-- Pill 2 -->
      <rect x="153" y="0" width="135" height="28" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
      <circle cx="167" cy="14" r="4" fill="#10b981" />
      <text x="179" y="18" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="600">28 REST Modules</text>

      <!-- Pill 3 -->
      <rect x="296" y="0" width="165" height="28" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
      <circle cx="310" cy="14" r="4" fill="#06b6d4" />
      <text x="322" y="18" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="600">Double-Entry Accounting</text>

      <!-- Pill 4 -->
      <rect x="469" y="0" width="135" height="28" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
      <circle cx="483" cy="14" r="4" fill="#f59e0b" />
      <text x="495" y="18" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="600">7 UI Design Modes</text>
    </g>

    <!-- Bottom Tech Badges -->
    <g transform="translate(0, 165)">
      <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1">STACK:</text>
      <text x="50" y="12" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">React 18</text>
      <text x="110" y="12" fill="#64748b" font-family="sans-serif" font-size="11">•</text>
      <text x="125" y="12" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="700">Vite 5</text>
      <text x="175" y="12" fill="#64748b" font-family="sans-serif" font-size="11">•</text>
      <text x="190" y="12" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="700">Node.js 20 (ESM)</text>
      <text x="295" y="12" fill="#64748b" font-family="sans-serif" font-size="11">•</text>
      <text x="310" y="12" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="700">MongoDB 7</text>
      <text x="395" y="12" fill="#64748b" font-family="sans-serif" font-size="11">•</text>
      <text x="410" y="12" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">Tailwind v3</text>
      <text x="495" y="12" fill="#64748b" font-family="sans-serif" font-size="11">•</text>
      <text x="510" y="12" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">AG Grid</text>
    </g>
  </g>
</svg>
